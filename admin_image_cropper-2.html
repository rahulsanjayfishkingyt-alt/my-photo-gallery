<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Image Cropper</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b12;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#171722;border:1px solid #29293a;border-radius:18px;padding:18px}h1{text-align:center}.upload{border:2px dashed #55556b;border-radius:14px;padding:25px;text-align:center}.editor{display:none;margin-top:18px}.stage{height:430px;background:#000;border-radius:14px;overflow:hidden;position:relative;touch-action:none}#photo{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;cursor:grab}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:10px;padding:11px 15px;background:#684cff;color:#fff;font-weight:700}button.green{background:#08a66a}button.red{background:#e33b4d}button.gray{background:#353546}.zoom{width:100%;margin-top:13px}.result{display:none;margin-top:18px}.result img{width:100%;border-radius:12px}</style></head><body><div class="wrap"><div class="card"><h1>Admin Image Cropper</h1><div class="upload"><b>Add Image</b><br><input id="file" type="file" accept="image/*"></div><div id="editor" class="editor"><div id="stage" class="stage"><img id="photo"></div><input id="zoom" class="zoom" type="range" min="0.1" max="4" step="0.01" value="1"><div class="controls"><button id="crop">✂ Crop</button><button id="reset" class="gray">↻ Reset</button><button id="save" class="green">⬇ Save</button><button id="delete" class="red">🗑 Delete</button></div><div id="result" class="result"><p>Cropped image</p><img id="output"></div></div></div></div><script>const file=document.getElementById('file'),editor=document.getElementById('editor'),stage=document.getElementById('stage'),photo=document.getElementById('photo'),zoom=document.getElementById('zoom'),output=document.getElementById('output'),result=document.getElementById('result');let x=0,y=0,scale=1,drag=false,sx=0,sy=0,ix=0,iy=0;function render(){photo.style.width=photo.naturalWidth*scale+'px';photo.style.height=photo.naturalHeight*scale+'px';photo.style.left=x+'px';photo.style.top=y+'px'}function fit(){scale=Math.max(stage.clientWidth/photo.naturalWidth,stage.clientHeight/photo.naturalHeight);x=(stage.clientWidth-photo.naturalWidth*scale)/2;y=(stage.clientHeight-photo.naturalHeight*scale)/2;zoom.value=scale;render()}file.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=v=>{photo.onload=()=>{fit();editor.style.display='block';result.style.display='none'};photo.src=v.target.result};r.readAsDataURL(f)};photo.onpointerdown=e=>{drag=true;sx=e.clientX;sy=e.clientY;ix=x;iy=y;photo.setPointerCapture(e.pointerId)};photo.onpointermove=e=>{if(drag){x=ix+e.clientX-sx;y=iy+e.clientY-sy;render()}};photo.onpointerup=photo.onpointercancel=()=>drag=false;zoom.oninput=()=>{let old=scale,n=+zoom.value,cx=stage.clientWidth/2,cy=stage.clientHeight/2,oldCX=x+photo.naturalWidth*old/2,oldCY=y+photo.naturalHeight*old/2,r=n/old;scale=n;x=cx+(oldCX-cx)*r-photo.naturalWidth*n/2;y=cy+(oldCY-cy)*r-photo.naturalHeight*n/2;render()};document.getElementById('reset').onclick=fit;document.getElementById('crop').onclick=()=>{let c=document.createElement('canvas');c.width=stage.clientWidth;c.height=stage.clientHeight;let ctx=c.getContext('2d');ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(photo,x,y,photo.naturalWidth*scale,photo.naturalHeight*scale);output.src=c.toDataURL('image/png');result.style.display='block'};document.getElementById('save').onclick=()=>{if(!output.src)return;let a=document.createElement('a');a.href=output.src;a.download='cropped-image.png';a.click()};document.getElementById('delete').onclick=()=>{if(confirm('Delete this image?')){file.value='';photo.src='';output.src='';editor.style.display='none';result.style.display='none';x=y=0;scale=1}};</script></body></html>
